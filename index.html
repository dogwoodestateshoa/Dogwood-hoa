<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root { --bg:#f6f8f5; --card:#fff; --ink:#1f2a24; --muted:#5b6b62; --line:#dfe6e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141a16; --card:#1d251f; --ink:#e8eee9; --muted:#9fb0a5; --line:#2c372f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:520px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:32px 24px; text-align:center; }
  h1 { margin:0 0 4px; font-size:1.75rem; }
  .sub { margin:0; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Dogwood Estates HOA</h1>
  <p class="sub">Our website is being updated. Please check back soon.</p>
