<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dogwood Estates HOA</title>
<meta name="description" content="Dogwood Estates HOA meetings and information.">
<style>
  :root { --bg:#f6f8f5; --card:#fff; --ink:#1f2a24; --muted:#5b6b62; --accent:#2f6b4f; --accent-ink:#fff; --line:#dfe6e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141a16; --card:#1d251f; --ink:#e8eee9; --muted:#9fb0a5; --accent:#5fb48a; --accent-ink:#0e1712; --line:#2c372f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:520px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:32px 24px; text-align:center; }
  h1 { margin:0 0 4px; font-size:1.75rem; }
  .sub { margin:0 0 24px; color:var(--muted); }
  .btn { display:inline-block; padding:14px 28px; border-radius:10px; background:var(--accent); color:var(--accent-ink);
         font-weight:600; text-decoration:none; }
  .btn:hover, .btn:focus-visible { filter:brightness(1.1); outline:2px solid var(--accent); outline-offset:3px; }
  dl { margin:24px 0 0; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:.95rem; }
  dt { font-weight:600; color:var(--ink); }
  dd { margin:0 0 10px; }
  .forms { margin:20px 0 0; padding-top:16px; border-top:1px solid var(--line); font-size:.95rem; }
  .forms h2 { margin:0 0 8px; font-size:1rem; }
  .forms a { color:var(--accent); font-weight:600; }
  .forms a:hover, .forms a:focus-visible { text-decoration:underline; }</style>
</head>
<body>
<main>
  <h1>Dogwood Estates HOA</h1>
  <p class="sub">Our website is being updated. Please check back soon.</p>
  <section class="forms">
    <h2>Forms</h2>
    <a href="Dogwood-Estates-HOA-Electronic-Notice-Consent-Form.pdf">Electronic Notice Consent Form (PDF)</a>
  </section>

</main>
</body>
</html>
